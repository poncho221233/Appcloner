name: Clone APK Pro

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL directa del APK original"
        required: true
        type: string
      app_name:
        description: "Nuevo nombre visible de la aplicación"
        required: true
        type: string
        default: "My Cloned App"

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip

      - name: Install Apktool
        run: |
          mkdir -p $HOME/tools
          cd $HOME/tools
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool
          echo "$HOME/tools" >> $GITHUB_PATH

      - name: Install Android build-tools 34
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          echo "y" | latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "build-tools;34.0.0" > /dev/null
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Download original APK
        run: |
          echo "Descargando: ${{ inputs.apk_url }}"
          wget -q --show-progress -O original.apk "${{ inputs.apk_url }}"
          ls -lh original.apk

      - name: Run cloner.py
        run: |
          python3 cloner.py \
            --apk original.apk \
            --name "${{ inputs.app_name }}" \
            --output cloned-signed.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloned-apk
          path: cloned-signed.apk
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        run: |
          echo "========================================"
          echo " APK clonado con éxito"
          echo " Nombre  : ${{ inputs.app_name }}"
          echo " Artifact: cloned-apk"
          echo "========================================"
